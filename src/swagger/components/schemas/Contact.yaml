type: object
properties:
  _id:
    type: string
    example: 60d0fe4f5311236168a109ca
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: +1234567890
  email:
    type: string
    example: john.doe@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
  photo:
    type: string
    example: https://res.cloudinary.com/example/image.jpg
  userId:
    type: string
    example: 60d0fe4f5311236168a109cb
