post:
  tags:
    - Auth
  summary: Register a new user
  operationId: registerUser
  description: Registers a new user with name, email, and password.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            email:
              type: string
              example: john.doe@example.com
            password:
              type: string
              example: password123
          required:
            - name
            - email
            - password
  responses:
    '201':
      description: Successfully registered a user
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully registered a user!
              data:
                type: object
                properties:
                  name:
                    type: string
                    example: John Doe
                  email:
                    type: string
                    example: john.doe@example.com
                  createdAt:
                    type: string
                    format: date-time
                    example: 2025-07-07T12:49:00Z
                  updatedAt:
                    type: string
                    format: date-time
                    example: 2025-07-07T12:49:00Z
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Invalid request body
    '409':
      description: Email already in use
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 409
              message:
                type: string
                example: Email in use
