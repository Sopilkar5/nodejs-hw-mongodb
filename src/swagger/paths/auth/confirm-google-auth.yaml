get:
  tags:
    - Auth
  summary: Handle Google OAuth callback
  operationId: confirmGoogleAuth
  description: Processes the Google OAuth callback and logs in the user, returning an access token and setting a refresh token in cookies.
  security: []
  responses:
    '200':
      description: Successfully logged in with Google
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully logged in with Google!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    '401':
      description: Unauthorized - Google authentication failed
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
