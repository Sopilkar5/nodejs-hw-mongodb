post:
  tags:
    - Auth
  summary: Refresh user session
  operationId: refreshUserSession
  description: Refreshes the user's session using a refresh token, returning a new access token and refresh token.
  security:
    - bearerAuth: []
  responses:
    '200':
      description: Successfully refreshed a session
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully refreshed a session!
              data:
                type: object
                properties:
                  accessToken:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      headers:
        Set-Cookie:
          schema:
            type: string
            example: refreshToken=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...; HttpOnly; Secure
    '401':
      description: Refresh token not provided or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Refresh token not provided
