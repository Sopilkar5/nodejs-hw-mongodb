get:
  tags:
    - Contacts
  summary: Retrieve a list of contacts
  operationId: getAllContacts
  description: Retrieves a paginated list of contacts for the authenticated user with optional filtering and sorting.
  security:
    - bearerAuth: []
  parameters:
    - in: query
      name: page
      schema:
        type: integer
        default: 1
      description: Page number
    - in: query
      name: perPage
      schema:
        type: integer
        default: 10
      description: Number of contacts per page
    - in: query
      name: sortBy
      schema:
        type: string
        default: name
        enum: [name]
      description: Field to sort by
    - in: query
      name: sortOrder
      schema:
        type: string
        default: asc
        enum: [asc, desc]
      description: Sort order
    - in: query
      name: type
      schema:
        type: string
        enum: [work, home, personal]
      description: Filter by contact type
    - in: query
      name: isFavourite
      schema:
        type: boolean
      description: Filter by favorite status
  responses:
    '200':
      description: Successfully retrieved contacts
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contacts!
              data:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                          example: 60d0fe4f5311236168a109ca
                        name:
                          type: string
                          example: John Doe
                        phoneNumber:
                          type: string
                          example: +1234567890
                        email:
                          type: string
                          example: john.doe@example.com
                        isFavourite:
                          type: boolean
                          example: false
                        contactType:
                          type: string
                          enum: [work, home, personal]
                          example: personal
                        photo:
                          type: string
                          example: https://res.cloudinary.com/example/image.jpg
                        userId:
                          type: string
                          example: 60d0fe4f5311236168a109cb
                  page:
                    type: integer
                    example: 1
                  perPage:
                    type: integer
                    example: 10
                  totalItems:
                    type: integer
                    example: 50
                  totalPages:
                    type: integer
                    example: 5
                  hasPreviousPage:
                    type: boolean
                    example: false
                  hasNextPage:
                    type: boolean
                    example: true
    '400':
      description: Invalid query parameters
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Invalid query parameters
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
