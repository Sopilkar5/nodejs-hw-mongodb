post:
  tags:
    - Contacts
  summary: Create a new contact
  operationId: createContact
  description: Creates a new contact for the authenticated user.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            phoneNumber:
              type: string
              example: +1234567890
            email:
              type: string
              example: john.doe@example.com
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
            photo:
              type: string
              format: binary
              description: Contact photo file
          required:
            - name
            - phoneNumber
            - contactType
  responses:
    '201':
      description: Successfully created a contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 201
              message:
                type: string
                example: Successfully created a contact!
              data:
                type: object
                properties:
                  _id:
                    type: string
                    example: 60d0fe4f5311236168a109ca
                  name:
                    type: string
                    example: John Doe
                  phoneNumber:
                    type: string
                    example: +1234567890
                  email:
                    type: string
                    example: john.doe@example.com
                  isFavourite:
                    type: boolean
                    example: false
                  contactType:
                    type: string
                    enum: [work, home, personal]
                    example: personal
                  photo:
                    type: string
                    example: https://res.cloudinary.com/example/image.jpg
                  userId:
                    type: string
                    example: 60d0fe4f5311236168a109cb
    '400':
      description: Invalid request body
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: Invalid request body
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
