get:
  tags:
    - Contacts
  summary: Retrieve a contact by ID
  operationId: getContactById
  description: Retrieves a specific contact by its ID for the authenticated user.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
      required: true
      description: The ID of the contact to retrieve
  responses:
    '200':
      description: Successfully retrieved the contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully found contact with id {contactId}!
              data:
                type: object
                properties:
                  _id:
                    type: string
                    example: 60d0fe4f5311236168a109ca
                  name:
                    type: string
                    example: John Doe
                  phoneNumber:
                    type: string
                    example: +1234567890
                  email:
                    type: string
                    example: john.doe@example.com
                  isFavourite:
                    type: boolean
                    example: false
                  contactType:
                    type: string
                    enum: [work, home, personal]
                    example: personal
                  photo:
                    type: string
                    example: https://res.cloudinary.com/example/image.jpg
                  userId:
                    type: string
                    example: 60d0fe4f5311236168a109cb
    '401':
      description: Unauthorized - Missing or invalid Bearer token
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
