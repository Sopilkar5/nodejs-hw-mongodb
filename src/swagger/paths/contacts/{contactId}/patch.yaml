patch:
  tags:
    - Contacts
  summary: Update a contact
  operationId: updateContact
  description: Updates an existing contact by ID for the authenticated user.
  security:
    - bearerAuth: []
  parameters:
    - in: path
      name: contactId
      schema:
        type: string
      required: true
      description: The ID of the contact to update
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            name:
              type: string
              example: John Doe
            phoneNumber:
              type: string
              example: +1234567890
            email:
              type: string
              example: john.doe@example.com
            isFavourite:
              type: boolean
              example: false
            contactType:
              type: string
              enum: [work, home, personal]
              example: personal
            photo:
              type: string
              format: binary
              description: Contact photo file
          required: []
  responses:
    '200':
      description: Successfully updated the contact
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully patched a contact!
              data:
                type: object
                properties:
                  _id:
                    type: string
                    example: 60d0fe4f5311236168a109ca
                  name:
                    type: string
                    example: John Doe
                  phoneNumber:
                    type: string
                    example: +1234567890
                  email:
                    type: string
                    example: john.doe@example.com
                  isFavourite:
                    type: boolean
                    example: false
                  contactType:
                    type: string
                    enum: [work, home, personal]
                    example: personal
                  photo:
                    type: string
                    example: https://res.cloudinary.com/example/image.jpg
                  userId:
                    type: string
                    example: 60d0fe4f5311236168a109cb
    '400':
      description: Invalid request body or no fields provided
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 400
              message:
                type: string
                example: At least one field or photo must be provided for update
    '401':
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 401
              message:
                type: string
                example: Unauthorized
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
